name: Deploy Add-in

# Manual by default — needs AZURE_STATIC_WEB_APPS_API_TOKEN (see infra/README.md)
# and ADDIN_PROD_URL / VITE_API_BASE_URL configured as repo variables/secrets.
# Once those exist, uncomment the `push` trigger to deploy on every merge to main.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/excel-addin/**'
  #     - 'packages/shared-types/**'
  #     - '.github/workflows/deploy-addin.yml'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          ADDIN_PROD_URL: ${{ vars.ADDIN_PROD_URL }}
        run: pnpm --filter @formula-in-action/excel-addin build

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/excel-addin/dist
          output_location: ''
          skip_app_build: true
