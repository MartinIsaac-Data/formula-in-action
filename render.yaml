# Render Blueprint — the simplest way to deploy apps/api (alternative to the
# Azure Container Apps path in infra/). Untested; review before applying.
#
# Deploy: connect this repo in the Render dashboard ("New +" → "Blueprint"),
# or `render blueprint launch` with the Render CLI. Set ANTHROPIC_API_KEY as a
# secret in the Render dashboard after the first deploy (never commit it here).
services:
  - type: web
    name: formula-in-action-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8787
      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: false
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: RATE_LIMIT_MAX
        value: 30
      - key: RATE_LIMIT_WINDOW
        value: 1 minute
      - key: PRIVACY_MODE
        value: cloud
      - key: AI_MODEL
        value: claude-sonnet-5
      - key: AI_STRUCTURED_OUTPUT
        value: true
      - key: TELEMETRY_ENABLED
        value: true
      - key: CORS_ORIGINS
        sync: false # set to the add-in's deployed origin
      - key: ANTHROPIC_API_KEY
        sync: false # set as a secret in the Render dashboard
